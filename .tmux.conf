# sourced from: https://github.com/LVala/dotfiles/blob/main/tmux/tmux.conf
# --------------------------------------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mode-keys vi
set -g status-keys emacs
set -g focus-events on

# styling and colorscheme
set -g @fg "#c5c9c7 "
set -g @bg "#000000"
set -g @muted "#5C6066"
set -g @left "#8ba4b0"
set -g @right "#938aa9"

set -g status on
set -g status-style "fg=#{@fg},bg=default"
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-style "fg=#{@muted},bg=default"
set -g window-status-format " #I:#W#F"

set -g window-status-current-style "fg=#{@fg},bg=default"
set -g window-status-current-format " #I:#W#F"

set -g status-left-style "fg=#{@bg},bg=#{@left},bold"
set -g status-left " #S "


set -g message-style "fg=#{@bg},bg=#{@left}"
set -g message-command-style "fg=#{@muted},bg=default"
set -g mode-style "fg=#{@bg},bg=#{@left}"

set -g menu-style "fg=#{@muted}"
set -g menu-selected-style "fg=#{@bg},bg=#{@left}"

# --------------------------------------------------------------------------------------------------------

# NOTE: this may be different on diff os
set -g status-right '  #(cat /sys/class/power_supply/BAT1/capacity)% | #{pane_current_path} '
set -g status-right-style "fg=#{@bg},bg=#{@left},bold"

bind-key C-b set-option status

# Move current window left/right
bind -n M-Left swap-window -t -1
bind -n M-Right swap-window -t +1

bind -n C-n new-window "~/.config/tmux-utils/fzf-sessions.sh"
bind -n C-Space next-window
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set-option -g default-shell /run/current-system/sw/bin/fish

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Setup 'y' to yank into system clipboard via pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Enable vi keys in copy mode
setw -g mode-keys vi


set -g window-status-separator ' '
