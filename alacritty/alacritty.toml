[font]
size = 21.0

[font.normal]
family = "Liga SFMono Nerd Font"
style = "Medium"

[font.bold]
family = "Liga SFMono Nerd Font"
style = "Medium"

[font.italic]
family = "Liga SFMono Nerd Font"
style = "Medium"

[window]
decorations = "none"
padding.x = 0
padding.y = 0
dynamic_padding = true
startup_mode = "Fullscreen"

[general]
import = [
    "~/.config/alacritty/themes/themes/goggle.toml",
]

[terminal]
# current path of fish to make sure alacritty runs fish by default
shell = "/run/current-system/sw/bin/fish"

[env]
TERM = "xterm-256color"

